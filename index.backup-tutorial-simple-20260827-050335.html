<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1b1f25">
  <link rel="icon" href="data:,">
  <title>BOUNCER — Infinite & World Tour</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #14171c;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
    body { position: fixed; inset: 0; display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; background: #14171c; }
    .game-shell {
      position: relative;
      width: min(100vw, 480px);
      height: min(100dvh, 1038px);
      aspect-ratio: 390 / 844;
      overflow: hidden;
      background: linear-gradient(180deg, #5A9DE1 0%, #7CB4E8 27%, #A7CCEE 52%, #D2E6F6 75%, #EFF8FD 90%, #FFFFFF 100%);
      border: 0;
      outline: 0;
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
      touch-action: none;
      contain: layout paint size;
    }
    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; outline: none; user-select: none; -webkit-user-select: none; background: transparent; }
    .orientation-guard { display: none; position: fixed; inset: 0; z-index: 1000; align-items: center; justify-content: center; flex-direction: column; gap: 11px; padding: 32px; background: #1b1f25; color: #f7f8fa; text-align: center; }
    .orientation-guard strong { font-size: 15px; line-height: 1; letter-spacing: .18em; }
    .orientation-guard p { margin: 0; color: #8e969f; font-size: 12px; letter-spacing: .04em; }
    .portrait-icon { position: relative; width: 32px; height: 48px; margin-bottom: 9px; border: 2px solid #cdd2d8; border-radius: 7px; transform: rotate(-12deg); }
    .portrait-icon::after { content: ''; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: #82c7ff; transform: translateX(-50%); }
    @media (max-width: 600px), (pointer: coarse) {
      body { display: grid; }
      .game-shell { width: 100vw; height: 100vh; height: 100dvh; max-width: 540px; aspect-ratio: auto; box-shadow: none; }
    }
    @media (orientation: landscape) and (pointer: coarse), (orientation: landscape) and (max-height: 600px) {
      .game-shell { visibility: hidden; pointer-events: none; }
      .orientation-guard { display: flex; }
    }
    @media (prefers-reduced-motion: reduce) { .game-shell { box-shadow: none; } }
  
    /* =====================================================
       BOUNCER BOOT SPLASH
       ===================================================== */

    #bouncer-boot-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000000;

      opacity: 1;
      visibility: visible;

      transition:
        opacity .32s ease,
        visibility .32s ease;

      pointer-events: auto;
    }

    #bouncer-boot-splash.is-hiding {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .bouncer-boot-logo {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;

      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-weight: 800;
      font-size: clamp(14px, 3.8vw, 18px);
      line-height: 1;

      letter-spacing: -2px;

      transform: translateY(-2px);

      animation:
        bouncerBootLogoIn
        .58s
        cubic-bezier(.2,.8,.2,1)
        both;
    }

    .bouncer-boot-logo-left,
    .bouncer-boot-logo-right {
      display: block;
    }

    .bouncer-boot-ball-area {
      position: relative;

      width: .55em;
      height: 1em;

      margin:
        0
        .05em;
    }

    .bouncer-boot-ball {
      position: absolute;

      left: 50%;
      top: 50%;

      width: .43em;
      height: .43em;

      border-radius: 50%;

      background: #ffffff;

      transform:
        translate(
          -50%,
          -42%
        );
    }

    .bouncer-boot-dot {
      position: absolute;

      left: 50%;

      border-radius: 50%;

      background: #ffffff;

      transform:
        translateX(-50%);
    }

    .bouncer-boot-dot-1 {
      width: .115em;
      height: .115em;
      top: -.18em;
      opacity: .30;
    }

    .bouncer-boot-dot-2 {
      width: .14em;
      height: .14em;
      top: .02em;
      opacity: .48;
    }

    .bouncer-boot-dot-3 {
      width: .17em;
      height: .17em;
      top: .22em;
      opacity: .68;
    }

    @keyframes bouncerBootLogoIn {
      from {
        opacity: 0;
        transform:
          translateY(8px)
          scale(.97);
      }

      to {
        opacity: 1;
        transform:
          translateY(-2px)
          scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bouncer-boot-logo {
        animation: none;
      }

      #bouncer-boot-splash {
        transition-duration: .15s;
      }
    }

  
    

  
    /* BOUNCER BOOT LOGO SIZE OVERRIDE */
    #bouncer-boot-splash .bouncer-boot-logo {
      scale: 0.5;
      transform-origin: center center;
    }
    /* END BOUNCER BOOT LOGO SIZE OVERRIDE */

  </style>
</head>

    // ---------------------------------------------------------
    // 한 쌍에서 아래쪽 포탈 = ENTRY
    // y 값이 클수록 게임 월드에서 아래에 위치한다.
    // ---------------------------------------------------------
    function wormholePairEnds(pairId){

      const pair=
        worldState.wormholePairs.get(
          pairId
        )||[];

      if(pair.length<2){
        return null;
      }

      const sorted=
        [...pair].sort(
          (a,b)=>a.y-b.y
        );

      return{
        exit:sorted[0],
        entry:sorted[sorted.length-1]
      };
    }


    // ---------------------------------------------------------
    // 포탈 파괴 효과
    // 플레이어 선이 공에 맞아 산산이 부서지는 느낌을 재사용한다.
    // ---------------------------------------------------------
    function shatterWormhole(wormhole){

      const pieces=14;

      for(
        let i=0;
        i<pieces;
        i++
      ){

        const angle=
          (i/pieces)*
          Math.PI*2;

        const radius=
          wormhole.radius+
          randomRange(
            -2,
            3
          );

        const x=
          wormhole.x+
          Math.cos(angle)*
          radius;

        const y=
          wormhole.y+
          Math.sin(angle)*
          radius;

        const speed=
          randomRange(
            55,
            145
          );

        const life=
          randomRange(
            .18,
            .30
          );

        effects.fragments.push({
          x,
          y,

          // 원의 접선 방향 조각
          angle:
            angle+
            Math.PI/2,

          length:
            randomRange(
              7,
              13
            ),

          // 바깥쪽으로 터진다.
          vx:
            Math.cos(angle)*
            speed,

          vy:
            Math.sin(angle)*
            speed-
            randomRange(
              15,
              45
            ),

          spin:
            randomRange(
              -8,
              8
            ),

          life,
          maxLife:life,

          // 흰색 / 파란색 교차
          color:
            i%2===0
              ? '#FFFFFF'
              : '#82C7FF'
        });
      }


      // 작은 빛 조각
      for(
        let i=0;
        i<8;
        i++
      ){

        const angle=
          randomRange(
            0,
            Math.PI*2
          );

        const distance=
          randomRange(
            2,
            wormhole.radius*.7
          );

        const color=
          i%2===0
            ? '#FFFFFF'
            : '#82C7FF';

        spawnBurst(
          wormhole.x+
            Math.cos(angle)*
            distance,

          wormhole.y+
            Math.sin(angle)*
            distance,

          1,
          color,
          randomRange(
            80,
            170
          ),
          .30,
          'diamond'
        );
      }
    }


    function consumeWormholePair(pairId){

      const pair=
        worldState.wormholePairs.get(
          pairId
        );

      if(
        !pair ||
        !pair.length
      ){
        return;
      }


      // 두 포탈 모두 동시에 파괴
      for(
        const wormhole of pair
      ){
        wormhole.used=true;
        shatterWormhole(
          wormhole
        );
      }


      const ids=
        new Set(
          pair.map(
            wormhole=>
              wormhole.id
          )
        );


      // 실제 월드에서는 즉시 제거.
      // fragments만 남아서 사라지는 애니메이션을 보여준다.
      worldState.wormholes=
        worldState.wormholes.filter(
          wormhole=>
            !ids.has(
              wormhole.id
            )
        );


      worldState.wormholePairs.delete(
        pairId
      );
    }


    function checkWormholeCollisions(){

      if(
        ball.wormholeCooldown>0 ||
        !worldState.wormholes.length
      ){
        return false;
      }


      const previous={
        x:ball.previousX,
        y:ball.previousY
      };

      const current={
        x:ball.x,
        y:ball.y
      };


      let selected=null;
      let selectedTime=Infinity;


      /*
        중요:
        위쪽 포탈은 출구라서 직접 들어갈 수 없다.
        아래쪽 포탈만 충돌 판정을 가진다.
      */
      for(
        const wormhole of worldState.wormholes
      ){

        const ends=
          wormholePairEnds(
            wormhole.pairId
          );

        if(
          !ends ||
          ends.entry.id!==wormhole.id
        ){
          continue;
        }


        const time=
          sweptPointCircleTime(
            previous,
            current,
            wormhole,
            wormhole.radius+
              ball.radius*.15
          );


        if(
          time!==null &&
          time<selectedTime
        ){
          selected={
            entry:ends.entry,
            exit:ends.exit
          };

          selectedTime=time;
        }
      }


      if(!selected){
        return false;
      }


      const entry=
        selected.entry;

      const exit=
        selected.exit;


      // 입장하기 직전 속도의 크기는 살짝 반영한다.
      const incomingSpeed=
        Math.hypot(
          ball.vx,
          ball.vy
        );


      /*
        EXIT 규칙

        포탈 orientation 무시.
        언제나 위쪽으로 발사.

        기존처럼 회전 계산을 하지 않기 때문에
        출구에서 아래나 반대 방향으로 나가는 현상이 사라진다.
      */
      const exitSpeed=
        clamp(
          Math.max(
            680,
            incomingSpeed*.92
          ),
          680,
          PHYSICS.maxBallSpeed*.92
        );


      const exitOffset=
        exit.radius+
        ball.radius+
        10;


      // 위쪽 출구 중심 바로 위에 생성
      ball.x=
        clamp(
          exit.x,
          ball.radius,
          WORLD.width-
            ball.radius
        );

      ball.y=
        exit.y-
        exitOffset;


      ball.previousX=
        ball.x;

      ball.previousY=
        ball.y;


      // 항상 위쪽
      ball.vx=0;
      ball.vy=-exitSpeed;


      ball.wormholeCooldown=.28;


      // 이전 궤적 제거
      effects.trail.length=0;


      // 순간이동 빛 효과
      spawnBurst(
        entry.x,
        entry.y,
        10,
        '#82C7FF',
        155,
        .28,
        'diamond'
      );

      spawnBurst(
        exit.x,
        exit.y,
        12,
        '#FFFFFF',
        175,
        .30,
        'diamond'
      );


      /*
        한 번 사용하면 두 포탈 모두 파괴.
      */
      consumeWormholePair(
        entry.pairId
      );


      addShake(
        2.4
      );

      audio.wormhole();

        'data-last-wormhole',

    // =========================================================
    // INFINITE — CONTINUOUS ATMOSPHERE → SPACE
    //
    // 더 이상 Earth / Planet / Galaxy 배경을 단계별로 띄우지 않는다.
    // 고도에 따라서 하나의 하늘이 천천히 어두워진다.
    // =========================================================
    function infiniteAtmospherePalette(altitude=game.displayAltitude){

      const km=Math.max(
        0,
        Number(altitude)||0
      );

      /*
        0km
          밝은 파란 하늘

        15km
          진한 파란색

        40km
          성층권 느낌

        100km
          우주 경계

        300km+
          거의 검정

        갑자기 색이 바뀌지 않도록
        구간마다 smoothstep으로 연결한다.
      */

      let top;
      let bottom;

      if(km<15){

        const t=smoothstep(
          km/15
        );

        top=mixColor(
          '#5A9DE1',
          '#376F9F',
          t
        );

        bottom=mixColor(
          '#FFFFFF',
          '#B7D4E5',
          t
        );

      }else if(km<40){

        const t=smoothstep(
          (km-15)/25
        );

        top=mixColor(
          '#376F9F',
          '#1E496F',
          t
        );

        bottom=mixColor(
          '#B7D4E5',
          '#668DA8',
          t
        );

      }else if(km<100){

        const t=smoothstep(
          (km-40)/60
        );

        top=mixColor(
          '#1E496F',
          '#0B1D35',
          t
        );

        bottom=mixColor(
          '#668DA8',
          '#1E3A52',
          t
        );

      }else if(km<300){

        const t=smoothstep(
          (km-100)/200
        );

        top=mixColor(
          '#0B1D35',
          '#040912',
          t
        );

        bottom=mixColor(
          '#1E3A52',
          '#0A1421',
          t
        );

      }else{

        /*
          깊은 우주도 완전 #000000 한 색으로 만들지 않고
          아주 약한 남색을 남겨 공/벽 가독성을 유지.
        */

        const t=smoothstep(
          Math.min(
            1,
            (km-300)/1500
          )
        );

        top=mixColor(
          '#040912',
          '#010308',
          t
        );

        bottom=mixColor(
          '#0A1421',
          '#030711',
          t
        );
      }

      /*
        별 등장 시점

        25km 이하 : 거의 없음
        25~80km   : 아주 조금
        80~180km  : 서서히 증가
        180km+    : 우주 느낌
      */

      const starAlpha=
        smoothstep(
          (km-25)/150
        );

      /*
        낮의 밝은 안개가 천천히 사라짐.
      */

      const hazeAlpha=
        1-
        smoothstep(
          (km-10)/90
        );

      return{
        top,
        bottom,
        starAlpha,
        hazeAlpha
      };
    }


    function drawInfiniteBackdrop(){

      const altitude=
        Math.max(
          0,
          game.displayAltitude
        );

      const climb=
        Math.max(
          0,
          game.totalClimbDistance
        );

      const palette=
        infiniteAtmospherePalette(
          altitude
        );

      // -----------------------------------------------------
      // 하나의 연속적인 세로 하늘
      // -----------------------------------------------------

      const gradient=
        ctx.createLinearGradient(
          0,
          0,
          0,
          WORLD.height
        );

      gradient.addColorStop(
        0,
        palette.top
      );

      gradient.addColorStop(
        1,
        palette.bottom
      );

      ctx.fillStyle=
        gradient;

      ctx.fillRect(
        0,
        0,
        WORLD.width,
        WORLD.height
      );


      // -----------------------------------------------------
      // 낮은 고도일 때만 아주 약한 밝은 대기층
      // -----------------------------------------------------

      if(palette.hazeAlpha>0.001){

        const haze=
          ctx.createLinearGradient(
            0,
            WORLD.height*.34,
            0,
            WORLD.height
          );

        haze.addColorStop(
          0,
          'rgba(255,255,255,0)'
        );

        haze.addColorStop(
          1,
          `rgba(238,248,255,${.18*palette.hazeAlpha})`
        );

        ctx.fillStyle=
          haze;

        ctx.fillRect(
          0,
          WORLD.height*.3,
          WORLD.width,
          WORLD.height*.7
        );
      }


      // -----------------------------------------------------
      // 별은 갑자기 등장하지 않고 천천히 보인다.
      // -----------------------------------------------------

      drawStars(
        palette.starAlpha*.92,
        altitude>400
          ? 84
          : altitude>120
            ? 68
            : 52
      );


      // -----------------------------------------------------
      // 기존 시작 지형
      // SKY / SEOUL 시작맵은 낮은 고도에서만 보이다 사라짐.
      // -----------------------------------------------------

      drawInfiniteOrigin(
        climb
      );


      // -----------------------------------------------------
      // 구름 역시 위로 갈수록 자연스럽게 사라짐
      // -----------------------------------------------------

      const cloudFade=
        1-
        smoothstep(
          altitude/45
        );

      if(cloudFade>0.001){

        drawWorldCloudBand(
          -900,
          1.18,
          cloudFade*.20
        );

        drawWorldCloudBand(
          -1370,
          1.38,
          cloudFade*.16
        );

        drawWorldCloudBand(
          -1830,
          1.08,
          cloudFade*.12
        );

        drawClouds(
          cloudFade*.18,
          game.uiTime*2.2-
          camera.y*.004
        );
      }


      // -----------------------------------------------------
      // 디버그용
      // -----------------------------------------------------

      canvas.setAttribute(
        'data-infinite-background',
        'continuous-atmosphere'
      );

      canvas.setAttribute(
        'data-space-background-assets',
        'disabled'
      );

      canvas.setAttribute(
        'data-atmosphere-altitude',
        altitude.toFixed(1)
      );
    }

      const palette=
        STRUCTURE_LINE_PALETTES[
          variant
        ]||
        STRUCTURE_LINE_PALETTES.wall;


      const vertical=
        object.h>
        object.w;

      const shortSide=
        Math.min(
          object.w,
          object.h
        );

      /*
        기존 물리 크기 느낌은 유지하되
        outer/core 두 겹 렌더링을 완전히 제거.
      */
      const outerWidth=clamp(shortSide*.68,9,12);

      const inset=
        outerWidth*.55;

      const bleed=
        outerWidth*1.4;

      const cx=
        object.x+
        object.w/2;

      const cy=
        sy+
        object.h/2;


      let x1;
      let y1;
      let x2;
      let y2;


      if(vertical){

        x1=cx;
        x2=cx;

        y1=
          sy+
          inset;

        y2=
          sy+
          object.h-
          inset;


        if(sy<=0){
          y1=-bleed;
        }

        if(
          sy+
          object.h>=
          WORLD.height
        ){
          y2=
            WORLD.height+
            bleed;
        }

      }else{

        y1=cy;
        y2=cy;

        x1=
          object.x+
          inset;

        x2=
          object.x+
          object.w-
          inset;


        if(object.x<=0){
          x1=-bleed;
        }

        if(
          object.x+
          object.w>=
          WORLD.width
        ){
          x2=
            WORLD.width+
            bleed;
        }
      }


      ctx.save();

      ctx.strokeStyle=
        palette.color;

      ctx.lineWidth=
        outerWidth;

      ctx.lineCap='round';
      ctx.lineJoin='round';

      ctx.beginPath();

      ctx.moveTo(
        x1,
        y1
      );

      ctx.lineTo(
        x2,
        y2
      );

      /*
        딱 한 번만 그린다.
        외곽선 / 내부선 없음.
      */
      ctx.stroke();

      ctx.restore();
    }


    function isSolidBlockWall(object){
      /*
        물리 충돌 영역에 실제 부피가 있는 벽인지 판단.

        일반 플랫폼은 보통 두께 15~22.
        짧은 변이 30px 이상이면
        단순 선이 아니라 블록으로 표시한다.
      */
      return Math.min(
        object.w,
        object.h
      )>=30;
    }


    function drawSolidBlockWall(object,sy){

        사용자가 보는 모양과

      */
      ctx.fillStyle='#FFFFFF';

      ctx.fillRect(
        object.x,
        sy,
        object.w,
        object.h
      );

      ctx.restore();
    }

    function drawMeteor(object,sy){

      const cx=
        object.x+
        object.w/2;

      const cy=
        sy+
        object.h/2;

      const radius=
        object.radius||
        Math.max(
          object.w,
          object.h
        )/2;


      /*
        실제 이동 방향을 구한다.
        꼬리는 진행 방향의 반대쪽으로 이어진다.
      */
      const vx=
        object.renderVX||
        object.velocityX||
        object.driftSpeed||
        0;

      const vy=
        object.renderVY||
        object.velocityY||
        object.fallSpeed||
        1;

      const speed=
        Math.max(
          1,
          Math.hypot(
            vx,
            vy
          )
        );

      const nx=
        vx/speed;

      const ny=
        vy/speed;


      ctx.save();


      // ======================================================
      // 1. 긴 흰색 소프트 테일
      // ======================================================

      const tailCount=11;

      for(
        let index=tailCount;
        index>=1;
        index--
      ){

        const progress=
          index/
          tailCount;

        /*
          공에서 멀어질수록 간격도 조금씩 커진다.
        */
        const distance=
          radius+
          index*
          radius*.62+
          index*index*.12;


        const tx=
          cx-
          nx*
          distance;

        const ty=
          cy-
          ny*
          distance;


        /*
          플레이어 공 낙하 trail처럼
          뒤쪽으로 갈수록 작고 흐려진다.
        */
        const alpha=
          .035+
          (1-progress)*
          .22;

        const trailRadius=
          radius*
          (
            .18+
            (1-progress)*
            .34
          );


        ctx.globalAlpha=
          alpha;

        ctx.fillStyle=
          '#FFFFFF';


        ctx.beginPath();

        ctx.ellipse(
          tx,
          ty,

          trailRadius*.78,
          trailRadius*1.28,

          Math.atan2(
            ny,
            nx
          )-
          Math.PI/2,

          0,
          Math.PI*2
        );

        ctx.fill();
      }


      // ======================================================
      // 2. 공 바로 뒤쪽의 밝은 짧은 꼬리
      // ======================================================

      for(
        let index=1;
        index<=4;
        index++
      ){

        const distance=
          radius+
          index*
          radius*.48;

        const tx=
          cx-
          nx*
          distance;

        const ty=
          cy-
          ny*
          distance;

        ctx.globalAlpha=
          .30-
          index*.045;

        ctx.fillStyle=
          '#FFFFFF';

        ctx.beginPath();

        ctx.arc(
          tx,
          ty,
          Math.max(
            1.4,
            radius*
            (
              .43-
              index*.055
            )
          ),
          0,
          Math.PI*2
        );

        ctx.fill();
      }


      // ======================================================
      // 3. 아주 은은한 흰색 glow
      // ======================================================

      ctx.globalAlpha=.18;

      ctx.shadowColor=
        '#FFFFFF';

      ctx.shadowBlur=
        11;

      ctx.fillStyle=
        '#FFFFFF';

      ctx.beginPath();

      ctx.arc(
        cx,
        cy,
        radius*1.06,
        0,
        Math.PI*2
      );

      ctx.fill();


      // ======================================================
      // 4. 본체
      //
      // 플레이어 BOUNCER 공과 같은
      // 외곽선 없는 순백색 원.
      // ======================================================

      ctx.shadowBlur=0;
      ctx.globalAlpha=1;

      ctx.fillStyle=
        '#FFFFFF';

      ctx.beginPath();

      ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
      );

      ctx.fill();


      ctx.restore();


      canvas.setAttribute(
        'data-meteor-visual',
        'bouncer-white-ball-long-trail'
      );
    }

    function drawStageMeteorWarnings(){for(const schedule of worldState.stageMeteors){if(schedule.state!=='warning')continue;const progress=clamp(schedule.warningElapsed/schedule.warningTime,0,1),pulse=.65+.35*Math.sin(game.uiTime*22),screenY=schedule.y-camera.y,x=clamp(schedule.x,16,WORLD.width-16),y=clamp(screenY,16,WORLD.height-16),speed=Math.hypot(schedule.vx,schedule.vy)||1,nx=schedule.vx/speed,ny=schedule.vy/speed;ctx.save();ctx.globalAlpha=.42+progress*.42;ctx.fillStyle=COLORS.danger;ctx.beginPath();ctx.arc(x,y,3.5+pulse*2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f4a16f';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-nx*10,y-ny*10);ctx.lineTo(x+nx*9,y+ny*9);ctx.stroke();ctx.restore();}}

    function drawMovementGuide(object){if(!object.movement)return;const centerX=object.baseX+object.w/2,centerY=worldToScreenY(object.baseY+object.h/2),distance=object.movement.distance;ctx.save();ctx.strokeStyle='rgba(215,229,238,.13)';ctx.lineWidth=1;ctx.setLineDash([3,6]);ctx.beginPath();if(object.movement.axis==='x'){ctx.moveTo(centerX-distance,centerY);ctx.lineTo(centerX+distance,centerY);}else{ctx.moveTo(centerX,centerY-distance);ctx.lineTo(centerX,centerY+distance);}ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(215,229,238,.2)';for(const direction of[-1,1]){const x=object.movement.axis==='x'?centerX+direction*distance:centerX,y=object.movement.axis==='y'?centerY+direction*distance:centerY;ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();}ctx.restore();}
    function drawWormhole(wormhole){

      if(wormhole.used){
        return;
      }


      const sy=
        worldToScreenY(
          wormhole.y
        );


      if(
        sy+
          wormhole.radius<
          -40 ||

        sy-
          wormhole.radius>
          WORLD.height+
          40
      ){
        return;
      }


      const r=
        wormhole.radius;

      const time=
        game.elapsed;

      const pulse=
        .5+
        .5*
        Math.sin(
          time*4.2+
          wormhole.x*.017
        );


      ctx.save();

      ctx.translate(
        wormhole.x,
        sy
      );


      // -----------------------------------------------------
      // 은은한 BLUE halo
      // -----------------------------------------------------

      ctx.shadowColor=
        'rgba(130,199,255,.72)';

      ctx.shadowBlur=
        12+
        pulse*7;


      ctx.strokeStyle=
        'rgba(130,199,255,.28)';

      ctx.lineWidth=7;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        r+3,
        0,
        Math.PI*2
      );

      ctx.stroke();


      ctx.shadowBlur=0;


      // -----------------------------------------------------
      // BLUE outer ring
      // -----------------------------------------------------

      ctx.strokeStyle=
        '#82C7FF';

      ctx.lineWidth=4.6;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        r,
        0,
        Math.PI*2
      );

      ctx.stroke();


      // -----------------------------------------------------
      // WHITE inner ring
      // -----------------------------------------------------

      ctx.strokeStyle=
        '#FFFFFF';

      ctx.lineWidth=2.4;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        r-6,
        0,
        Math.PI*2
      );

      ctx.stroke();


      // -----------------------------------------------------
      // 중앙은 살짝 투명한 파란색
      // -----------------------------------------------------

      const center=
        ctx.createRadialGradient(
          0,
          0,
          0,
          0,
          0,
          r-7
        );

      center.addColorStop(
        0,
        'rgba(255,255,255,.08)'
      );

      center.addColorStop(
        .48,
        'rgba(130,199,255,.15)'
      );

      center.addColorStop(
        1,
        'rgba(130,199,255,.04)'
      );

      ctx.fillStyle=
        center;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        r-7,
        0,
        Math.PI*2
      );

      ctx.fill();


      // -----------------------------------------------------
      // 회전하는 흰색 / 파란색 arc
      // 방향 화살표는 없음.
      // -----------------------------------------------------

      const rotation=
        time*1.25;


      for(
        let i=0;
        i<4;
        i++
      ){

        const start=
          rotation+
          i*
          Math.PI/2;

        ctx.strokeStyle=
          i%2===0
            ? '#FFFFFF'
            : '#82C7FF';

        ctx.globalAlpha=
          .76;

        ctx.lineWidth=
          2.1;

        ctx.lineCap=
          'round';

        ctx.beginPath();

        ctx.arc(
          0,
          0,
          r-11,
          start,
          start+.56
        );

        ctx.stroke();
      }


      // 작은 orbit 점
      ctx.globalAlpha=
        .9;

      for(
        let i=0;
        i<3;
        i++
      ){

        const angle=
          -rotation*.72+
          i*
          Math.PI*2/3;

        const orbitR=
          r-3;

        ctx.fillStyle=
          i===0
            ? '#FFFFFF'
            : '#82C7FF';

        ctx.beginPath();

        ctx.arc(
          Math.cos(angle)*
            orbitR,

          Math.sin(angle)*
            orbitR,

          i===0
            ? 2.1
            : 1.55,

          0,
          Math.PI*2
        );

        ctx.fill();
      }


      ctx.restore();
    }


    function drawStructures(){canvas.setAttribute('data-wall-visual','single-color-lines-and-solid-blocks');for(const object of worldState.objects)drawMovementGuide(object);for(const object of worldState.objects){const sy=worldToScreenY(object.y);if(object.type==='meteor'&&sy>-170&&sy<-42)drawMeteorWarning(object,sy);if(sy+object.h<-70||sy>WORLD.height+70)continue;if(object.type==='wall')drawWall(object,sy);else if(object.type==='deathwall')drawDeathWall(object,sy);else if(object.type==='hazard')drawHazard(object,sy);else if(object.type==='boost'||object.type==='jumpwall')drawBoost(object,sy);else if(object.type==='satellite')drawSatellite(object,sy);else if(object.type==='meteor')drawMeteor(object,sy);else if(object.type==='asteroid')drawAsteroid(object,sy);}for(const wormhole of worldState.wormholes)drawWormhole(wormhole);}
    function shardDiamondPath(radius){ctx.beginPath();ctx.moveTo(0,-radius);ctx.lineTo(radius*.72,0);ctx.lineTo(0,radius);ctx.lineTo(-radius*.72,0);ctx.closePath();}
    function drawShards(){

      canvas.setAttribute(
        'data-shard-contrast',
        'pure-white-solid'
      );


      for(
        const shard of
        worldState.shards
      ){

        const sy=
          worldToScreenY(
            shard.y
          );


        if(
          sy<-20 ||
          sy>
            WORLD.height+
            20
        ){
          continue;
        }


        const pulse=
          1+
          Math.sin(
            shard.pulse
          )*.08;


        ctx.save();

        ctx.translate(
          shard.x,
          sy
        );

        ctx.rotate(
          shard.angle
        );

        ctx.scale(
          pulse,
          pulse
        );


        /*
          기존:
          하늘색 큰 다이아
          + 흰색 작은 다이아

          변경:
          흰색 다이아 하나만.
        */
        ctx.fillStyle=
          '#FFFFFF';

        shardDiamondPath(
          shard.radius
        );

        ctx.fill();


        ctx.restore();
      }
    }

    function homeLogoMetrics(){
      const y=HOME_LAYOUT.logoY;
      const gap=4;
      const fontSize=homeLogoFontSize();

      ctx.save();

      ctx.font=
        `800 ${fontSize}px ui-sans-serif, sans-serif`;

      const leftWidth=
        ctx.measureText('B').width;

      const rightWidth=
        ctx.measureText('UNCER').width;

      const visualBallRadius=ball.radius;

      const totalWidth=
        leftWidth+
        gap+
        visualBallRadius*2+
        gap+
        rightWidth;

      const startX=
        (WORLD.width-totalWidth)/2;

      const ballX=
        startX+
        leftWidth+
        gap+
        visualBallRadius;

      ctx.restore();

      return{
        y,
        gap,
        fontSize,
        leftWidth,
        rightWidth,
        startX,
        ballX
      };
    }

    function drawHomeLogo(alpha,includeBall=true){
      const layout=
        homeLogoMetrics();

      if(
        game.screen==='menu' &&
        game.phase==='homeIdle'
      ){
        ball.x=layout.ballX;
        ball.y=layout.y+1;

        ball.previousX=ball.x;
        ball.previousY=ball.y;

        ball.vx=0;
        ball.vy=0;
      }

      ctx.save();

      ctx.globalAlpha=alpha;

      ctx.fillStyle='#FFFFFF';

      ctx.textAlign='left';
      ctx.textBaseline='middle';

      ctx.font=
        `800 ${layout.fontSize}px ui-sans-serif, sans-serif`;

      ctx.fillText(
        'B',
        layout.startX,
        layout.y
      );

      ctx.fillText(
        'UNCER',
        layout.ballX+
        ball.radius+
        layout.gap,
        layout.y
      );


      /*
        위의 작은 점들도

      */
      const logoScale=
        layout.fontSize/39;

      for(let i=0;i<5;i++){

        const radius=
          (2.5-i*.34)*
          logoScale;

        const pointY=
          layout.y-
          22*logoScale-
          i*7.2*logoScale;

        ctx.arc(
          layout.ballX,
          pointY,
          radius,
          0,
          Math.PI*2

      ctx.textAlign='center';

      ctx.font=

        ctx.restore();
      }
    }

      y,
      w,
      h
    ){
      ctx.save();


      // ------------------------------------------------------
      // 이미지 대신 어두운 단색 카드

      drawRoundedRect(
        x,
        y,
        w,
        h,
        5,
        'rgba(18,22,27,.58)',
        'rgba(255,255,255,.065)',
        1
      );


      const cx=
        x+w/2;

      const cy=
        y+h/2+1;


      /*
        작은 썸네일에서도 잘 보이도록

      */
      const size=
        Math.min(
          15,
          h*.58

      const bodyW=
        size*.74;

      const bodyH=
        size*.56;


      // ------------------------------------------------------
      // LOCK SHACKLE
      // ------------------------------------------------------

      ctx.strokeStyle=
        'rgba(181,190,200,.72)';

      ctx.lineWidth=
        Math.max(
          1.2,
          size*.11

      ctx.lineCap='round';

      ctx.beginPath();

      ctx.arc(
        cx,
        cy-bodyH*.42,
        bodyW*.32,
        Math.PI,
        0
      );

      ctx.stroke();


      // ------------------------------------------------------
      // LOCK BODY
      // ------------------------------------------------------

      drawRoundedRect(
        cx-bodyW/2,
        cy-bodyH*.10,
        bodyW,
        bodyH,
        Math.max(
          2,
          size*.12

        'rgba(160,170,180,.68)'

      // ------------------------------------------------------

      ctx.fillStyle=
        'rgba(38,44,51,.82)';

      ctx.beginPath();

      ctx.arc(

        cy+bodyH*.12,
        Math.max(

          size*.075

        0,
        Math.PI*2

      ctx.fill();


      ctx.fillRect(
        cx-Math.max(0.7,size*.04),
        cy+bodyH*.15,
        Math.max(1.4,size*.08),
        Math.max(2,size*.14)

      const cardWidth=

          WORLD.width-

      const startY=154;
      const bottomReserve=42;
      const rowGap=9;

      // 브라우저 주소창 때문에 실제 세로 화면이 짧아져도

      const availableForCards=
        Math.max(
          280,
          visibleHeight-
          startY-
          bottomReserve-
          rowGap*(rows-1)
        );

      const cardHeight=
        clamp(
          availableForCards/rows,
          56,
          78
        );

      const rowStep=
        cardHeight+
        rowGap;

      stages.forEach(
        (stage,index)=>{
          const col=index%2;
          const row=Math.floor(index/2);

          const x=
            cardX+
            col*(
              cardWidth+
              columnGap

          const y=
            startY+
            row*rowStep;

          const w=cardWidth;
          const h=cardHeight;

          const unlocked=
            index<unlockedCount;

          const stars=
            progress.stars[stage.id]||0;

          const label=
            `${city.name} ${String(index+1).padStart(2,'0')}`;

          drawRoundedRect(

            y,
            w,
            h,
            13,
            unlocked

          ctx.font=

          ctx.fillText(
            label,
            x+13,
            y+11

          const region=
            stage.region||
            stage.title;

          ctx.fillStyle=
            unlocked

              :'#484f57';

          ctx.font=
            `650 ${
              region.length>14

            x+w-12,
            y+12
          );

          const previewW=50;
          const previewH=
            Math.min(
              25,
              Math.max(
                20,
                h-47
              )
            );

          const previewX=
            x+w-previewW-14;

          const previewY=
            y+h-previewH-9;

          if(unlocked){

            /*
              플레이 가능한 스테이지만
              실제 배경 미리보기를 공개한다.
            */
            if(
              STAGE_IMAGE_BACKGROUNDS[
                stage.background
              ]
            ){
              drawStageImagePreview(
                stage.background,
                previewX,
                previewY,
                previewW,
                previewH,
                true
              );

            }else{

              drawCityPreview(
                cityId,
                previewX,
                previewY,
                previewW,
                previewH,
                true
              );
            }

          }else{

            /*
              아직 진입할 수 없는 스테이지는
              서울 / 뉴욕 / 도쿄 / 이후 도시 전부
              이미지 대신 자물쇠 표시.
            */
            drawLockedStagePreview(
              previewX,
              previewY,
              previewW,
              previewH
            );
          }

          if(unlocked){
            registerHitArea(
              x,
              y,
              w,
              h,
              `stage:${cityId}:${index}`
            );
          }
        }
      );

      const footerY=
        Math.min(
          visibleHeight-20,
          startY+
          rows*rowStep+
          7

      ctx.fillStyle='rgba(211,216,222,.62)';

        'data-stage-select-layout',
        'mobile-width-fill'

    // =========================================================================
    // Wall pause
    // =========================================================================

    function pauseFirstRunTutorial(
      stepIndex
    ){
      const step=
        FIRST_RUN_TUTORIAL_STEPS[
          stepIndex
        ];

      if(!step){
        return;
      }

      firstRunTutorial.state='pause';

      firstRunTutorial.currentStep=
        stepIndex;

      game.phase='tutorialPause';

      game.activeLine=null;

      abortDrawing();

      canvas.setAttribute(
        'data-tutorial',
        `pause:${step.id}`
      );

      audio.ui();
    }


    function updateFirstRunTutorial(dt){

      // -----------------------------------------------------
      // 장애물이 위에서 화면 안으로 들어오면
      // 즉시 게임을 정지하고 설명.
      // -----------------------------------------------------

      if(
        firstRunTutorial.enabled &&
        firstRunTutorial.state==='running' &&
        game.gameMode==='tutorial' &&
        game.screen==='playing' &&
        game.phase==='playing'
      ){
        const step=
          FIRST_RUN_TUTORIAL_STEPS[
            firstRunTutorial.nextStep
          ];

        if(step){
          const object=
            firstRunTutorial.objects.get(
              step.id
            );

          if(object){
            const screenY=
              worldToScreenY(
                object.y
              );

            if(
              screenY>=105 &&
              screenY<=275
            ){
              pauseFirstRunTutorial(
                firstRunTutorial.nextStep
              );
            }
          }
        }
      }


      // -----------------------------------------------------
      // 모두 설명했으면 화면을 천천히 어둡게
      // -----------------------------------------------------

      if(
        firstRunTutorial.state==='finish'
      ){
        firstRunTutorial.finishTimer+=dt;

        const delay=.18;
        const fadeDuration=.72;

        firstRunTutorial.fade=
          clamp(
            (
              firstRunTutorial.finishTimer-
              delay
            )/
            fadeDuration,
            0,
            1
          );

        if(
          firstRunTutorial.fade>=1
        ){
          safeSet(
            FIRST_RUN_TUTORIAL_KEY,
            '1'
          );

          firstRunTutorial.enabled=false;
          firstRunTutorial.state='returning';
          firstRunTutorial.fade=1;


    // =====================================================
    // BOUNCER FIRST-VISIT + TUTORIAL CHECKPOINT V3
    // =====================================================

    /*
      브라우저의 전체 방문 기록 자체는
      웹 페이지에서 읽을 수 없다.

      대신 BOUNCER가 자기 사이트에서 남긴
      localStorage를 기준으로 이전 방문 여부를 판단한다.

      첫 접속 순간 바로 visit key를 기록하므로
      튜토리얼 도중 새로고침해도 다음 접속에는
      자동으로 다시 튜토리얼이 뜨지 않는다.
    */

    const BOUNCER_VISIT_KEY=
      'bounce_has_visited_v1';

    const BOUNCER_FORCE_TUTORIAL_SESSION_KEY=
      'bounce_force_tutorial_once_v1';


    function hasStoredBouncerVisit(){

      try{

        for(
          let index=0;
          index<localStorage.length;
          index++
        ){
          const key=
            localStorage.key(index)||'';

          if(
            key.startsWith('bounce_') &&
            key!==BOUNCER_VISIT_KEY
          ){
            return true;
          }
        }

      }catch(error){}

      return(
        safeGet(
          BOUNCER_VISIT_KEY,
          '0'
        )==='1'
      );
    }


    let forceTutorialOnce=false;

    try{

      forceTutorialOnce=
        sessionStorage.getItem(
          BOUNCER_FORCE_TUTORIAL_SESSION_KEY
        )==='1';

      if(forceTutorialOnce){

        sessionStorage.removeItem(
          BOUNCER_FORCE_TUTORIAL_SESSION_KEY
        );
      }

    }catch(error){}


    const bouncerHadPriorVisit=
      !forceTutorialOnce &&
      hasStoredBouncerVisit();


    // 현재 접속은 즉시 방문 처리
    safeSet(
      BOUNCER_VISIT_KEY,
      '1'
    );


    if(bouncerHadPriorVisit){

      // 기존 사용자:
      // 튜토리얼을 절대 자동 시작하지 않는다.
      safeSet(
        FIRST_RUN_TUTORIAL_KEY,
        '1'
      );

      firstRunTutorial.enabled=false;

      firstRunTutorial.state=
        'done';

      firstRunTutorial.nextStep=0;
      firstRunTutorial.currentStep=-1;

      firstRunTutorial.finishTimer=0;
      firstRunTutorial.fade=0;

    }else{

      // 완전히 새로운 사용자
      safeSet(
        FIRST_RUN_TUTORIAL_KEY,
        '0'
      );

      firstRunTutorial.enabled=true;

      firstRunTutorial.state=
        'intro';

      firstRunTutorial.nextStep=0;
      firstRunTutorial.currentStep=-1;

      firstRunTutorial.finishTimer=0;
      firstRunTutorial.fade=0;
    }


    /*
      개발/테스트용.

      브라우저 콘솔에서

      BOUNCER_RESET_TUTORIAL()

      입력하면 딱 한 번
      새 사용자처럼 튜토리얼을 다시 볼 수 있다.
    */
    window.BOUNCER_RESET_TUTORIAL=
      function(){

        try{

          sessionStorage.setItem(
            BOUNCER_FORCE_TUTORIAL_SESSION_KEY,
            '1'
          );

        }catch(error){}

        safeSet(
          FIRST_RUN_TUTORIAL_KEY,
          '0'
        );

        location.reload();
      };


    // =====================================================
    // Tutorial progress checkpoint
    // =====================================================

    function currentTutorialCheckpointIndex(){

      /*
        현재 설명창에서 죽을 일은 거의 없지만,
        혹시 pause 상태라면 현재 단계 그대로.
      */
      if(
        firstRunTutorial.currentStep>=0
      ){
        return clamp(
          firstRunTutorial.currentStep,
          0,
          FIRST_RUN_TUTORIAL_STEPS.length-1
        );
      }


      /*
        설명을 보고 진행 중이면
        nextStep은 다음 설명을 가리킨다.

        따라서 nextStep - 1이
        마지막으로 배운 체크포인트다.

        예:
        WHITE 설명 후 진행 -> nextStep 1 -> WHITE(0)
        RED 설명 후 진행   -> nextStep 2 -> RED(1)
        BLUE 설명 후 진행  -> nextStep 3 -> BLUE(2)
      */
      if(
        firstRunTutorial.nextStep>0
      ){
        return clamp(
          firstRunTutorial.nextStep-1,
          0,
          FIRST_RUN_TUTORIAL_STEPS.length-1
        );
      }


      // 아직 첫 벽까지 도착하지 못한 경우
      return -1;
    }


    function restoreTutorialCheckpoint(
      stepIndex
    ){

      abortDrawing();

      /*
        아직 첫 벽 설명 전 사망:
        로고 밑 선 긋기 부분으로 돌아간다.
      */
      if(stepIndex<0){

        prepareHomeIdle();

        firstRunTutorial.enabled=true;

        firstRunTutorial.state=
          'homePrompt';

        firstRunTutorial.nextStep=0;
        firstRunTutorial.currentStep=-1;

        firstRunTutorial.finishTimer=0;
        firstRunTutorial.fade=0;

        canvas.setAttribute(
          'data-tutorial',
          'home-checkpoint'
        );

        return;
      }


      /*
        현재 튜토리얼 월드를 깨끗하게 다시 만든다.
      */
      resetRuntime();

      game.gameMode=
        'tutorial';

      game.currentStage=null;

      game.screen=
        'playing';

      game.phase=
        'playing';

      game.homeLaunch=false;

      firstRunTutorial.enabled=true;

      firstRunTutorial.state=
        'running';

      firstRunTutorial.nextStep=
        stepIndex;

      firstRunTutorial.currentStep=-1;

      firstRunTutorial.finishTimer=0;
      firstRunTutorial.fade=0;


      setupFirstRunTutorialWorld();


      const step=
        FIRST_RUN_TUTORIAL_STEPS[
          stepIndex
        ];

      const object=
        firstRunTutorial.objects.get(
          step.id
        );


      /*
        설명할 벽을 화면 상단 약 190px에 배치.
      */
      const objectWorldY=
        object
          ?object.y
          :step.y;

      camera.y=
        objectWorldY-190;

      camera.targetY=
        camera.y;


      /*
        공은 해당 벽보다 충분히 아래에 재배치.

        벽이 왼쪽이면 공은 오른쪽,
        벽이 오른쪽이면 공은 왼쪽에서 시작해서
        다시 진행하기 편하게 한다.
      */
      const centerX=
        step.x+
        step.w/2;

      ball.x=
        centerX<
        WORLD.width/2
          ?300
          :90;

      ball.y=
        camera.y+535;

      ball.previousX=
        ball.x;

      ball.previousY=
        ball.y;

      ball.vx=
        ball.x>centerX
          ?-22
          :22;

      ball.vy=
        -110;

      ball.wormholeCooldown=0;


      game.activeLine=null;

      effects.trail.length=0;


      /*
        원래 튜토리얼의 pause 함수를 그대로 사용.
        따라서 벽 설명 UI와
        "진행하려면 선을 그으시오" 동작도 유지된다.
      */
      pauseFirstRunTutorial(
        stepIndex
      );


      canvas.setAttribute(
        'data-tutorial-checkpoint',
        step.id
      );
    }


    /*
      일반 게임의 endRun은 그대로 보존하고
      튜토리얼에서만 체크포인트 복귀로 바꾼다.
    */
    const normalEndRunBeforeTutorialCheckpoint=
      endRun;


    endRun=
      function(
        reason='FALL',
        x=ball.x,
        y=ball.y
      ){

        if(
          game.gameMode==='tutorial' &&
          firstRunTutorial.enabled &&
          (
            firstRunTutorial.state==='running' ||
            firstRunTutorial.state==='pause'
          )
        ){

          const checkpoint=
            currentTutorialCheckpointIndex();

          audio.death();

          restoreTutorialCheckpoint(
            checkpoint
          );

          return;
        }


        return normalEndRunBeforeTutorialCheckpoint(
          reason,
          x,
          y
        );
      };


          prepareHomeIdle();

          game.tutorialAlpha=0;

          canvas.setAttribute(
            'data-tutorial',
            'complete'
          );
        }
      }

      else if(
        firstRunTutorial.state===
          'returning'
      ){
        firstRunTutorial.fade=
          Math.max(
            0,
            firstRunTutorial.fade-
              dt/.55
          );

        if(
          firstRunTutorial.fade<=0
        ){
          /*
            게임 조작 튜토리얼 종료 후
            홈 메뉴 기능 설명으로 이동.
          */
          firstRunTutorial.state='homeGuide';
          firstRunTutorial.enabled=true;
          firstRunTutorial.homeGuideIndex=0;
          firstRunTutorial.fade=0;

          prepareHomeIdle();

          game.tutorialAlpha=0;

          canvas.setAttribute(
            'data-tutorial',
            'home-guide:world-tour'
          );
        }
      }
    }

    function drawTutorialPauseOverlay(){
      const step=
        FIRST_RUN_TUTORIAL_STEPS[
          firstRunTutorial.currentStep
        ];

      if(!step){
        return;
      }

      const object=
        firstRunTutorial.objects.get(
          step.id
        );

      if(!object){
        return;
      }

      const screenY=
        worldToScreenY(
          object.y
        );

      const paddingX=14;
      const paddingY=18;

      const holeX=
        clamp(
          object.x-paddingX,
          0,
          WORLD.width
        );

      const holeY=
        clamp(
          screenY-paddingY,
          0,
          WORLD.height
        );

      const holeW=
        Math.min(
          WORLD.width-holeX,
          object.w+
            paddingX*2
        );

      const holeH=
        object.h+
        paddingY*2;


      ctx.save();

      // 전체 화면은 어둡게
      ctx.fillStyle=
        'rgba(28,32,37,.70)';

      ctx.fillRect(
        0,
        0,
        WORLD.width,
        WORLD.height
      );

      // 설명 중인 벽은 다시 선명하게 그림
      if(step.type==='wall'){
        drawWall(
          object,
          screenY
        );
      }

      else if(
        step.type==='deathwall'
      ){
        drawDeathWall(
          object,
          screenY
        );
      }

      else if(
        step.type==='jumpwall'
      ){
        drawBoost(
          object,
          screenY
        );
      }


      ctx.strokeStyle=
        step.type==='deathwall'
          ?'rgba(255,121,100,.95)'
          :step.type==='jumpwall'
          ?'rgba(130,199,255,.95)'
          :'rgba(255,255,255,.90)';

      ctx.lineWidth=1.5;

      roundedRectPath(
        ctx,
        holeX,
        holeY,
        holeW,
        holeH,
        8
      );

      ctx.stroke();


      const visibleHeight=
        Math.min(
          WORLD.height,
          viewport.visibleLogicalHeight
        );

      const cardW=
        WORLD.width-56;

      const cardH=
        step.type==='jumpwall'
          ?150
          :136;

      const cardX=28;

      const cardY=
        clamp(
          visibleHeight-
            cardH-
            52,
          385,
          590
        );

      drawRoundedRect(
        cardX,
        cardY,
        cardW,
        cardH,
        18,
        'rgba(22,26,31,.95)',
        'rgba(255,255,255,.13)',
        1
      );


      ctx.textAlign='left';
      ctx.textBaseline='top';

      ctx.fillStyle=
        step.type==='deathwall'
          ?'#FF7964'
          :step.type==='jumpwall'
          ?'#82C7FF'
          :'#FFFFFF';

      ctx.font=
        '760 16px ui-sans-serif, sans-serif';

      ctx.fillText(
        step.title,
        cardX+20,
        cardY+18
      );


      ctx.fillStyle=
        'rgba(247,248,250,.79)';

      ctx.font=
        '600 10px ui-sans-serif, sans-serif';

      step.description.forEach(
        (line,index)=>{
          ctx.fillText(
            line,
            cardX+20,
            cardY+51+
              index*18
          );
        }
      );


      ctx.fillStyle=
        'rgba(247,248,250,.48)';

      ctx.font=
        '650 8.5px ui-sans-serif, sans-serif';

      ctx.fillText(
        '진행하려면 선을 그으시오',
        cardX+20,
        cardY+
          cardH-
          24
      );

      ctx.restore();


      if(
        input.drawing &&
        input.start &&
        input.end
      ){
        drawPlayerLine(
          {
            a:input.start,
            b:input.end
          },
          1,
          true
        );
      }
    }


    // =========================================================================
    // HOME MENU GUIDE
    // 게임 튜토리얼 이후 WORLD TOUR / SKINS / ACHIEVEMENTS 설명
    // =========================================================================

    const HOME_TUTORIAL_GUIDE_STEPS=
      Object.freeze([
        Object.freeze({
          id:'world-tour',
          title:'WORLD TOUR',
          centerX:70,

          description:[
            '도시별 스테이지에 도전하는 모드입니다.',
            '스테이지를 클리어하면 다음 도시와',
            '새로운 무한 모드 맵을 해금할 수 있어요.'
          ]
        }),

        Object.freeze({
          id:'skins',
          title:'SKINS',
          centerX:195,

          description:[
            '공과 궤적의 색상을 바꿀 수 있습니다.',
            '무한 모드에서 시작할',
            '도시 맵도 여기서 선택할 수 있어요.'
          ]
        }),

        Object.freeze({
          id:'achievements',
          title:'ACHIEVEMENTS',
          centerX:320,

          description:[
            '게임을 플레이하며 특별한 조건을 달성하면',
            '업적과 배지를 획득할 수 있습니다.'
          ]
        })
      ]);


    function currentHomeTutorialGuideStep(){
      return(
        HOME_TUTORIAL_GUIDE_STEPS[
          clamp(
            firstRunTutorial.homeGuideIndex||0,
            0,
            HOME_TUTORIAL_GUIDE_STEPS.length-1
          )
        ]
      );
    }


    function drawTutorialHomeGuideOverlay(){

      if(
        game.screen!=='menu'
      ){
        return;
      }


      const step=
        currentHomeTutorialGuideStep();

      if(!step){
        return;
      }


      const navY=
        homeNavigationY();

      /*
        홈 네비 아이콘 + 글자를 한 원 안에 잡는다.
      */
      const holeX=
        step.centerX;

      const holeY=
        navY-10;

      const holeRadius=48;


      ctx.save();


      // ------------------------------------------------------
      // 전체 화면 반투명 회색
      // 현재 설명 중인 메뉴 부분만 원형으로 뚫는다.
      // ------------------------------------------------------

      ctx.fillStyle=
        'rgba(66,70,75,.70)';

      ctx.beginPath();

      ctx.rect(
        0,
        0,
        WORLD.width,
        WORLD.height
      );

      ctx.arc(
        holeX,
        holeY,
        holeRadius,
        0,
        Math.PI*2
      );

      ctx.fill(
        'evenodd'
      );


      // ------------------------------------------------------
      // 강조 원 바깥쪽 BLUE glow
      // ------------------------------------------------------

      const pulse=
        .5+
        .5*
        Math.sin(
          game.uiTime*4
        );

      ctx.shadowColor=
        'rgba(130,199,255,.72)';

      ctx.shadowBlur=
        8+
        pulse*7;

      ctx.strokeStyle=
        'rgba(130,199,255,.95)';

      ctx.lineWidth=3;

      ctx.beginPath();

      ctx.arc(
        holeX,
        holeY,
        holeRadius,
        0,
        Math.PI*2
      );

      ctx.stroke();


      // ------------------------------------------------------
      // 안쪽 WHITE ring
      // ------------------------------------------------------

      ctx.shadowBlur=0;

      ctx.strokeStyle=
        'rgba(255,255,255,.92)';

      ctx.lineWidth=1.4;

      ctx.beginPath();

      ctx.arc(
        holeX,
        holeY,
        holeRadius-5,
        0,
        Math.PI*2
      );

      ctx.stroke();


      // ------------------------------------------------------
      // 설명 카드
      // ------------------------------------------------------

      const cardW=
        WORLD.width-48;

      const cardH=142;

      const cardX=24;

      const cardY=
        clamp(
          navY-258,
          330,
          535
        );


      drawRoundedRect(
        cardX,
        cardY,
        cardW,
        cardH,
        18,
        'rgba(25,29,34,.94)',
        'rgba(255,255,255,.14)',
        1
      );


      // 단계 표시
      ctx.textAlign='left';
      ctx.textBaseline='top';

      ctx.fillStyle=
        '#82C7FF';

      ctx.font=
        '700 8px ui-sans-serif, sans-serif';

      ctx.fillText(
        `${(firstRunTutorial.homeGuideIndex||0)+1} / ${HOME_TUTORIAL_GUIDE_STEPS.length}`,
        cardX+20,
        cardY+17
      );


      // 제목
      ctx.fillStyle=
        '#FFFFFF';

      ctx.font=
        '780 17px ui-sans-serif, sans-serif';

      ctx.fillText(
        step.title,
        cardX+20,
        cardY+34
      );


      // 설명
      ctx.fillStyle=
        'rgba(247,248,250,.78)';

      ctx.font=
        '600 9.5px ui-sans-serif, sans-serif';

      step.description.forEach(
        (line,index)=>{
          ctx.fillText(
            line,
            cardX+20,
            cardY+67+
              index*17
          );
        }
      );


      // 다음 안내
      ctx.textAlign='right';

      ctx.fillStyle=
        'rgba(247,248,250,.48)';

      ctx.font=
        '650 8px ui-sans-serif, sans-serif';

      ctx.fillText(
        firstRunTutorial.homeGuideIndex>=
          HOME_TUTORIAL_GUIDE_STEPS.length-1
            ? '클릭하여 튜토리얼 완료'
            : '클릭하여 다음',
        cardX+cardW-20,
        cardY+cardH-21
      );


      ctx.restore();


      canvas.setAttribute(
        'data-tutorial-home-guide',
        step.id
      );
    }


    function drawFirstRunTutorialOverlay(){

      if(
        firstRunTutorial.state==='homeGuide'
      ){
        drawTutorialHomeGuideOverlay();
        return;
      }

      if(
        firstRunTutorial.state==='intro'
      ){
        drawTutorialIntroOverlay();
      }

      else if(
        firstRunTutorial.state===
          'homePrompt'
      ){
        drawTutorialHomePrompt();
      }

      else if(
        firstRunTutorial.state==='pause'
      ){
        drawTutorialPauseOverlay();
      }

      else if(
        firstRunTutorial.state==='finish' ||
        firstRunTutorial.state==='returning'
      ){
        ctx.save();

        ctx.fillStyle=
          `rgba(20,23,28,${
            firstRunTutorial.fade
          })`;

        ctx.fillRect(
          0,
          0,
          WORLD.width,
          WORLD.height
        );

        ctx.restore();
      }
    }


    // =========================================================================
    // HOME GUIDE INPUT
    // =========================================================================

    canvas.addEventListener(
      'pointerdown',
      event=>{

        if(
          firstRunTutorial.state!=='homeGuide'
        ){
          return;
        }


        /*
          설명 중에는 실제 WORLD TOUR / SKINS /
          ACHIEVEMENTS 메뉴를 열지 않는다.
        */
        event.preventDefault();
        event.stopImmediatePropagation();

        audio.ui();


        const nextIndex=
          (firstRunTutorial.homeGuideIndex||0)+1;


        if(
          nextIndex>=
          HOME_TUTORIAL_GUIDE_STEPS.length
        ){
          /*
            모든 홈 메뉴 설명 완료.
          */

          firstRunTutorial.homeGuideIndex=
            HOME_TUTORIAL_GUIDE_STEPS.length-1;

          firstRunTutorial.state='done';
          firstRunTutorial.enabled=false;
          firstRunTutorial.fade=0;

          safeSet(
            FIRST_RUN_TUTORIAL_KEY,
            '1'
          );

          canvas.setAttribute(
            'data-tutorial',
            'complete'
          );

          canvas.removeAttribute(
            'data-tutorial-home-guide'
          );

          return;
        }


        firstRunTutorial.homeGuideIndex=
          nextIndex;


        const step=
          HOME_TUTORIAL_GUIDE_STEPS[
            nextIndex
          ];


        canvas.setAttribute(
          'data-tutorial',
          `home-guide:${step.id}`
        );

      },
      {
        capture:true,
        passive:false
      }
    );


    // =========================================================================
    // Input gate
    // =========================================================================

    canvas.addEventListener(
      'pointerdown',
      event=>{

        if(
          !firstRunTutorial.enabled
        ){
          return;
        }


        // 첫 회색 인사 화면:
        // 아무 곳이나 한번 클릭하면 다음 설명.
        if(
          firstRunTutorial.state==='intro'
        ){
          event.preventDefault();
          event.stopImmediatePropagation();

          advanceFirstRunTutorialIntro();

          return;
        }


        // 홈 설명에서는 로고 공 아래쪽 전체만 조작 가능.
        if(
          firstRunTutorial.state===
            'homePrompt' &&
          game.screen==='menu'
        ){
          const point=
            pointerToScreen(
              event
            );

          if(
            point.y<
              tutorialHomeSplitY()
          ){
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }
      },
      {
        capture:true,
        passive:false
      }
    );


    // =========================================================================
    // 홈 튜토리얼 drawing endpoint
    // =========================================================================

    const originalUpdateDrawingEndpoint=
      updateDrawingEndpoint;


    updateDrawingEndpoint=
      function tutorialUpdateDrawingEndpoint(
        event
      ){
        const result=
          originalUpdateDrawingEndpoint(
            event
          );


        if(
          firstRunTutorial.enabled &&
          firstRunTutorial.state===
            'homePrompt' &&
          game.screen==='menu' &&
          input.endScreen
        ){
          const minimumY=
            tutorialHomeSplitY()+2;

          if(
            input.endScreen.y<
              minimumY
          ){
            input.endScreen.y=
              minimumY;

            syncDrawingWorldPoints();
          }
        }

        return result;
      };


    // =========================================================================
    // 설명 화면에서도 선 그리기
    // =========================================================================

    const originalCanDrawLineNow=
      canDrawLineNow;


    canDrawLineNow=
      function tutorialCanDrawLineNow(){
        return(
          originalCanDrawLineNow() ||
          (
            firstRunTutorial.state===
              'pause' &&
            game.screen==='playing' &&
            game.phase===
              'tutorialPause'
          )
        );
      };


    // =========================================================================
    // 홈 첫 선 → Infinite가 아니라 Tutorial
    // =========================================================================

    const originalLaunchInfiniteFromHome=
      launchInfiniteFromHome;


    launchInfiniteFromHome=
      function tutorialLaunchFromHome(){

        if(
          firstRunTutorial.enabled &&
          firstRunTutorial.state===
            'homePrompt'
        ){
          startFirstRunTutorialFromHome();
          return;
        }

        return(
          originalLaunchInfiniteFromHome()
        );
      };


    // =========================================================================
    // Tutorial line commit
    // =========================================================================

    const originalCommitCurrentDrawing=
      commitCurrentDrawing;


    commitCurrentDrawing=
      function tutorialCommitCurrentDrawing(){

        const wasHomePrompt=
          firstRunTutorial.enabled &&
          firstRunTutorial.state===
            'homePrompt' &&
          game.screen==='menu';


        const wasPause=
          firstRunTutorial.enabled &&
          firstRunTutorial.state===
            'pause' &&
          game.gameMode==='tutorial';


        // 첫 번째 선은 거의 평평한 선으로 자동 보정.
        if(
          wasHomePrompt &&
          input.startScreen &&
          input.endScreen
        ){
          const flatY=
            (
              input.startScreen.y+
              input.endScreen.y
            )/2;

          input.startScreen.y=
            flatY;

          input.endScreen.y=
            flatY;

          syncDrawingWorldPoints();
        }


        const committed=
          originalCommitCurrentDrawing();

        if(!committed){
          return false;
        }


        if(wasPause){
          const currentIndex=
            firstRunTutorial.currentStep;

          const isLastStep=
            currentIndex>=
            FIRST_RUN_TUTORIAL_STEPS.length-1;


          if(isLastStep){
            // 파란 벽 설명까지 끝.
            // 선을 그은 순간 페이드 종료 시작.
            firstRunTutorial.state=
              'finish';

            firstRunTutorial.finishTimer=0;
            firstRunTutorial.fade=0;

            game.phase=
              'tutorialFinish';

            game.activeLine=null;

            abortDrawing();

            canvas.setAttribute(
              'data-tutorial',
              'finishing'
            );
          }

          else{
            firstRunTutorial.nextStep=
              currentIndex+1;

            firstRunTutorial.currentStep=
              -1;

            firstRunTutorial.state=
              'running';

            game.phase='playing';

            canvas.setAttribute(
              'data-tutorial',
              'running'
            );
          }
        }

        return true;
      };


    // =========================================================================
    // Tutorial에서 죽으면 결과창 대신 처음 조작 설명으로
    // =========================================================================

    const originalEndRun=
      endRun;


    endRun=
      function tutorialEndRun(
        reason='FALL',
        x=ball.x,
        y=ball.y
      ){
        if(
          game.gameMode==='tutorial' &&
          firstRunTutorial.state!=='finish' &&
          firstRunTutorial.state!=='returning' &&
          firstRunTutorial.state!=='done'
        ){
          firstRunTutorial.state=
            'homePrompt';

          firstRunTutorial.nextStep=0;
          firstRunTutorial.currentStep=-1;

          firstRunTutorial.finishTimer=0;
          firstRunTutorial.fade=0;

          firstRunTutorial.enabled=true;

          prepareHomeIdle();

          canvas.setAttribute(
            'data-tutorial',
            'restart'
          );

          return;
        }

        return(
          originalEndRun(
            reason,
            x,
            y
          )
        );
      };


    // =========================================================================
    // Update hook
    // =========================================================================

    const originalUpdateTransitions=
      updateTransitions;


    updateTransitions=
      function tutorialUpdateTransitions(
        dt
      ){
        originalUpdateTransitions(dt);

        updateFirstRunTutorial(dt);
      };


    // =========================================================================
    // Render hook
    // =========================================================================

    const originalRender=
      render;


    render=
      function tutorialRender(){
        originalRender();

        const shouldDraw=
          (
            firstRunTutorial.enabled &&
            firstRunTutorial.state!=='done'
          ) ||
          firstRunTutorial.state===
            'returning';

        if(!shouldDraw){
          return;
        }

        ctx.save();

        applyLogicalViewportTransform();

        drawFirstRunTutorialOverlay();

        ctx.restore();
      };

    prepareHomeIdle();
    applyLocalPreviewQuery();

    // =========================================================================
    // Game loop
    // =========================================================================
    let previousTimestamp=performance.now(),accumulator=0;
    function gameLoop(timestamp){const frameTime=Math.min((timestamp-previousTimestamp)/1000,.05);previousTimestamp=timestamp;game.uiTime+=frameTime;updateDesktopDrawingAssist();if(game.screen==='playing'){accumulator+=frameTime;while(accumulator>=PHYSICS.fixedStep){updatePhysics(PHYSICS.fixedStep);accumulator-=PHYSICS.fixedStep;}}else accumulator=0;updateTransitions(frameTime);updateEffects(frameTime);render();requestAnimationFrame(gameLoop);}
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
